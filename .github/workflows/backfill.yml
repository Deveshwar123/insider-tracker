name: Backfill SEC Form 4

# One-off catch-up after an outage (e.g. IT-12: 2026-09-21 → 2026-11-08 missing).
# Same worker as the nightly sweep, but for many days, so it gets up to 5h40m
# instead of ingest.yml's 30 minutes. It dedupes by accession number, so if it
# times out, running it again picks up where it stopped.
#
# Its own concurrency group: the 15-minute live polls keep running alongside it.
# Both write with upserts, so an overlap is harmless.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many completed days to sweep, ending yesterday"
        required: true
        default: "50"

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: worker
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Sweep the last ${{ github.event.inputs.days }} days
        run: npx tsx src/index.ts --days ${{ github.event.inputs.days }}
